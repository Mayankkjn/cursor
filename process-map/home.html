<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whatfix Lens — Overview</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav" id="side-nav">
      <div class="side-nav-header">
        <div class="brand">
          <svg class="brand-icon" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
            <circle cx="13" cy="13" r="11" stroke="currentColor" stroke-width="2.2" />
            <path d="M13 4 C13 9 9 13 4 13 C9 13 13 17 13 22 C13 17 17 13 22 13 C17 13 13 9 13 4 Z" fill="currentColor" opacity="0.85" />
          </svg>
          <span class="brand-name">Whatfix Lens</span>
        </div>
        <button class="grid-btn" type="button" aria-label="Switch apps">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
            <circle cx="3" cy="3" r="1.6" /><circle cx="9" cy="3" r="1.6" /><circle cx="15" cy="3" r="1.6" />
            <circle cx="3" cy="9" r="1.6" /><circle cx="9" cy="9" r="1.6" /><circle cx="15" cy="9" r="1.6" />
            <circle cx="3" cy="15" r="1.6" /><circle cx="9" cy="15" r="1.6" /><circle cx="15" cy="15" r="1.6" />
          </svg>
        </button>
      </div>

      <button class="sidebar-collapse-btn" id="sidebar-collapse" type="button" aria-label="Collapse sidebar">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M9 3 L4.5 7 L9 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <nav class="side-nav-items">
        <button class="nav-item active" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5" />
            <path d="M2 9 H16 M9 2 C11.2 4.2 11.2 13.8 9 16 M9 2 C6.8 4.2 6.8 13.8 9 16" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="2.4" stroke="currentColor" stroke-width="1.5" />
            <path d="M9 1.8 V3.4 M9 14.6 V16.2 M16.2 9 H14.6 M3.4 9 H1.8 M14.05 3.95 L12.9 5.1 M5.1 12.9 L3.95 14.05 M14.05 14.05 L12.9 12.9 M5.1 5.1 L3.95 3.95" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="side-nav-footer">
        <div class="avatar">JD</div>
        <span class="user-name">John Doe</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header"><h1>Overview</h1></header>

      <section class="stat-cards">
        <div class="stat-card">
          <div class="stat-label">Total Process Discovered</div>
          <div class="stat-value" id="stat-total-processes">–</div>
          <div class="stat-sub">processes</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Unique Users</div>
          <div class="stat-value" id="stat-total-users">–</div>
          <div class="stat-sub">users</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Roles</div>
          <div class="stat-value" id="stat-total-roles">–</div>
          <div class="stat-sub">roles</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Business Units</div>
          <div class="stat-value" id="stat-total-bu">–</div>
          <div class="stat-sub">Business Units</div>
        </div>
      </section>

      <section class="processes-section">
        <div class="processes-toolbar">
          <h2>All processes</h2>
          <div class="toolbar-actions">
            <div class="filter-wrap">
              <button class="filter-button" id="filter-button" type="button">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M1.5 2 H12.5 L8.5 6.8 V11.5 L5.5 10 V6.8 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
                </svg>
                Filter
              </button>
              <div class="filter-panel hidden" id="filter-panel">
                <label for="filter-bu">Business Unit</label>
                <select id="filter-bu">
                  <option value="">All</option>
                </select>
              </div>
            </div>
            <div class="search-wrap">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <circle cx="6" cy="6" r="4.3" stroke="currentColor" stroke-width="1.3" />
                <path d="M9.2 9.2 L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
              <input type="text" id="search-input" placeholder="Search" />
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="process-table">
            <thead>
              <tr>
                <th class="sortable" id="sort-title">
                  Title
                  <svg class="sort-icon" width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                    <path d="M2 4.5 L5.5 1 L9 4.5 M2 6.5 L5.5 10 L9 6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </th>
                <th>Role</th>
                <th>Business Units</th>
                <th>Median Duration</th>
                <th>Process count</th>
                <th>Users</th>
              </tr>
            </thead>
            <tbody id="process-tbody"></tbody>
          </table>
          <div class="empty-state hidden" id="empty-state">No processes match your search.</div>
        </div>

        <div class="table-footer">
          <span class="rows-summary" id="rows-summary"></span>
          <div class="pagination" id="pagination"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="home-data.js"></script>
  <script src="home.js"></script>
</body>
</html>
