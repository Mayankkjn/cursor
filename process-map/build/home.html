<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whatfix Lens — Overview</title>
  <style>
:root {
  --sidebar-bg: #12141c;
  --sidebar-border: #232633;
  --sidebar-text: #c7c9d6;
  --sidebar-text-dim: #7d8092;
  --brand-orange: #ff5a2e;
  --brand-orange-soft: rgba(255, 90, 46, 0.14);
  --accent-blue: #2563eb;

  --bg: #f5f5f9;
  --card-bg: #ffffff;
  --border: #e9e9f1;
  --text-primary: #24263a;
  --text-secondary: #8b8fa6;
  --text-tertiary: #b2b5c6;
  --shadow-sm: 0 1px 2px rgba(24, 26, 51, 0.05);
}

* { box-sizing: border-box; }
.hidden { display: none !important; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
}

.app-shell { display: flex; min-height: 100vh; }

/* ---- sidebar ---- */
.side-nav {
  width: 264px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  position: relative;
  transition: width 0.18s ease;
}
.side-nav.collapsed { width: 76px; }
.side-nav.collapsed .brand-name,
.side-nav.collapsed .nav-item span,
.side-nav.collapsed .user-name { display: none; }
.side-nav.collapsed .side-nav-header { justify-content: center; }
.side-nav.collapsed .grid-btn { display: none; }

.side-nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--sidebar-border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-icon { flex-shrink: 0; color: var(--brand-orange); }
.brand-name { font-weight: 700; font-size: 1.05rem; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid-btn {
  background: none; border: none; color: var(--sidebar-text-dim); cursor: pointer;
  padding: 4px; border-radius: 6px; flex-shrink: 0;
}
.grid-btn:hover { color: var(--sidebar-text); background: rgba(255,255,255,0.06); }

.sidebar-collapse-btn {
  position: absolute;
  top: 22px;
  right: -12px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--sidebar-bg);
  border: 1px solid var(--sidebar-border);
  color: var(--sidebar-text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}
.sidebar-collapse-btn:hover { color: #fff; }
.sidebar-collapse-btn svg { transition: transform 0.18s ease; }
.side-nav.collapsed .sidebar-collapse-btn svg { transform: rotate(180deg); }

.side-nav-items { display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 8px;
  color: var(--sidebar-text); text-decoration: none; font-size: 0.9rem; font-weight: 500;
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
}
.nav-item svg { flex-shrink: 0; }
.nav-item:hover { background: rgba(255,255,255,0.05); }
.nav-item.active { background: var(--brand-orange-soft); color: var(--brand-orange); }
.nav-item.active svg { color: var(--brand-orange); }

.side-nav-footer {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px; border-top: 1px solid var(--sidebar-border);
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: #3a3f58; color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700;
}
.user-name { font-size: 0.88rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- main content ---- */
.main-content { flex: 1; min-width: 0; padding: 28px 36px 40px; }

.page-header { padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.page-header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; box-shadow: var(--shadow-sm);
}
.stat-label { font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 10px; }
.stat-value { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px; }

.processes-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); }
.processes-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; flex-wrap: wrap; gap: 12px; }
.processes-toolbar h2 { margin: 0; font-size: 1.05rem; }
.toolbar-actions { display: flex; align-items: center; gap: 10px; }

.filter-wrap { position: relative; }
.filter-button, .search-wrap {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  background: #fff; color: var(--text-secondary); font-size: 0.85rem; cursor: pointer;
}
.filter-button:hover { border-color: var(--text-tertiary); color: var(--text-primary); }
.search-wrap { cursor: text; min-width: 220px; }
.search-wrap input {
  border: none; outline: none; font-size: 0.85rem; width: 100%; color: var(--text-primary); background: none;
}
.search-wrap svg, .filter-button svg { flex-shrink: 0; color: var(--text-tertiary); }

.filter-panel {
  position: absolute; top: calc(100% + 6px); left: 0;
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(20,20,40,0.12); padding: 14px; width: 220px; z-index: 5;
}
.filter-panel.hidden { display: none; }
.filter-panel label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; }
.filter-panel select {
  width: 100%; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; color: var(--text-primary);
}

.table-wrap { overflow-x: auto; }
.process-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.process-table th {
  text-align: left; padding: 10px 22px; color: var(--text-secondary); font-weight: 600;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap;
}
.process-table th.sortable { cursor: pointer; user-select: none; }
.process-table th.sortable:hover { color: var(--text-primary); }
.process-table th .sort-icon { margin-left: 4px; vertical-align: -2px; color: var(--text-tertiary); }
.process-table td { padding: 14px 22px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-primary); }
.process-table tbody tr { cursor: pointer; transition: background 0.1s; }
.process-table tbody tr:hover { background: #fafafd; }
.process-table tbody tr:last-child td { border-bottom: none; }
.process-title { font-weight: 600; }
.process-description { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
.process-table td.num { font-variant-numeric: tabular-nums; }

.table-footer { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; flex-wrap: wrap; gap: 10px; }
.rows-summary { font-size: 0.82rem; color: var(--text-secondary); }
.pagination { display: flex; align-items: center; gap: 4px; }
.page-btn {
  min-width: 30px; height: 30px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border);
  background: #fff; color: var(--text-secondary); font-size: 0.82rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.page-btn:hover:not(:disabled):not(.active) { border-color: var(--text-tertiary); color: var(--text-primary); }
.page-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
.page-btn:disabled { opacity: 0.4; cursor: default; }
.page-ellipsis { color: var(--text-tertiary); padding: 0 4px; font-size: 0.82rem; }

.empty-state { padding: 40px 22px; text-align: center; color: var(--text-secondary); font-size: 0.88rem; }

@media (max-width: 900px) {
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
}

</style>
</head>

  <script>
// Sample process: Purchase Order to Payment
// Each variant is one real-world route through the process. Weight controls
// how often that route occurs relative to the others in the generated log.

const START = '● START';
const END = '■ END';

const VARIANT_DEFS = [
  {
    id: 'v1',
    label: 'Standard flow',
    weight: 66,
    path: [
      'Create Request', 'Manager Approval', 'Budget Check',
      'Vendor Selection', 'PO Creation', 'Goods Receipt',
      'Invoice Match', 'Payment',
    ],
  },
  {
    id: 'v2',
    label: 'Low-value PO (budget check skipped)',
    weight: 14,
    path: [
      'Create Request', 'Manager Approval',
      'Vendor Selection', 'PO Creation', 'Goods Receipt',
      'Invoice Match', 'Payment',
    ],
  },
  {
    id: 'v3',
    label: 'Invoice mismatch rework loop',
    weight: 9,
    path: [
      'Create Request', 'Manager Approval', 'Budget Check',
      'Vendor Selection', 'PO Creation', 'Goods Receipt',
      'Invoice Mismatch', 'Vendor Selection', 'PO Creation', 'Goods Receipt',
      'Invoice Match', 'Payment',
    ],
  },
  {
    id: 'v4',
    label: 'Rejected at approval',
    weight: 6,
    path: [
      'Create Request', 'Manager Approval', 'Rejected',
    ],
  },
  {
    id: 'v5',
    label: 'Approval/budget order swapped',
    weight: 5,
    path: [
      'Create Request', 'Budget Check', 'Manager Approval',
      'Vendor Selection', 'PO Creation', 'Goods Receipt',
      'Invoice Match', 'Payment',
    ],
  },
  // v6-v8: a handful of rare one-off exception paths that all fork from the
  // same approval step. Individually each is a tiny sliver of cases — this
  // is exactly the shape semantic zoom collapses into a single "+N minor
  // variants" bubble rather than drawing four separate low-frequency
  // branches off "Manager Approval" permanently.
  {
    id: 'v6',
    label: 'Escalated to finance review',
    weight: 2,
    path: ['Create Request', 'Manager Approval', 'Escalated to Finance Review'],
  },
  {
    id: 'v7',
    label: 'Escalated to legal review',
    weight: 1.5,
    path: ['Create Request', 'Manager Approval', 'Escalated to Legal Review'],
  },
  {
    id: 'v8',
    label: 'Flagged as duplicate request',
    weight: 1,
    path: ['Create Request', 'Manager Approval', 'Flagged as Duplicate Request'],
  },
];

// [min, max] minutes a task typically takes. Used to synthesize durations.
const STEP_DURATION_MINUTES = {
  'Create Request': [5, 25],
  'Manager Approval': [30, 300],
  'Budget Check': [15, 120],
  'Vendor Selection': [60, 600],
  'PO Creation': [10, 45],
  'Goods Receipt': [180, 2000],
  'Invoice Match': [20, 100],
  'Invoice Mismatch': [40, 180],
  'Payment': [15, 60],
  'Rejected': [5, 20],
  'Escalated to Finance Review': [10, 45],
  'Escalated to Legal Review': [15, 60],
  'Flagged as Duplicate Request': [2, 10],
};

function pickVariant() {
  const total = VARIANT_DEFS.reduce((s, v) => s + v.weight, 0);
  let r = Math.random() * total;
  for (const v of VARIANT_DEFS) {
    if (r < v.weight) return v;
    r -= v.weight;
  }
  return VARIANT_DEFS[VARIANT_DEFS.length - 1];
}

function randomDuration(task) {
  const [min, max] = STEP_DURATION_MINUTES[task] || [10, 60];
  // Skew toward the low end with an occasional long tail, like real cycle times.
  const skew = Math.pow(Math.random(), 2);
  return Math.round(min + skew * (max - min));
}

function generateEventLog(numCases = 500) {
  // Synthesize a plausible unique-user pool (68% of case volume, e.g. 340
  // for the default 500 cases) and shuffle case->user assignment so every
  // pool member is guaranteed to appear at least once.
  const userPoolSize = Math.max(1, Math.min(numCases, Math.round(numCases * 0.68)));
  const userIds = Array.from({ length: numCases }, (_, i) => `U-${1 + (i % userPoolSize)}`);
  for (let i = userIds.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [userIds[i], userIds[j]] = [userIds[j], userIds[i]];
  }

  const cases = [];
  for (let i = 0; i < numCases; i++) {
    const variant = pickVariant();
    let cursor = 0;
    const steps = variant.path.map((task) => {
      const duration = randomDuration(task);
      const step = { task, startOffset: cursor, duration };
      cursor += duration;
      return step;
    });
    cases.push({
      caseId: `PO-${1000 + i}`,
      variantId: variant.id,
      totalDuration: cursor,
      users: [userIds[i]],
      steps,
    });
  }
  return cases;
}

function median(numbers) {
  if (!numbers.length) return 0;
  const sorted = numbers.slice().sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// A small, hand-written example a user can download to see the expected
// upload format: either { "cases": [...] } or a bare array of cases; each
// case either { "caseId", "steps": [...] } or a bare array of steps; each
// step either a plain string or { "task", "duration" } (minutes).
const SAMPLE_JSON_TEMPLATE = {
  cases: [
    {
      caseId: 'CASE-1001',
      steps: [
        { task: 'Create Request', duration: 12 },
        { task: 'Manager Approval', duration: 95 },
        { task: 'Budget Check', duration: 40 },
        { task: 'Vendor Selection', duration: 180 },
        { task: 'PO Creation', duration: 20 },
        { task: 'Goods Receipt', duration: 600 },
        { task: 'Invoice Match', duration: 45 },
        { task: 'Payment', duration: 25 },
      ],
    },
    {
      caseId: 'CASE-1002',
      steps: [
        { task: 'Create Request', duration: 8 },
        { task: 'Manager Approval', duration: 110 },
        { task: 'Vendor Selection', duration: 220 },
        { task: 'PO Creation', duration: 18 },
        { task: 'Goods Receipt', duration: 540 },
        { task: 'Invoice Match', duration: 38 },
        { task: 'Payment', duration: 22 },
      ],
    },
    {
      caseId: 'CASE-1003',
      steps: [
        { task: 'Create Request', duration: 15 },
        { task: 'Manager Approval', duration: 60 },
        { task: 'Rejected', duration: 10 },
      ],
    },
  ],
};

// Pulls a plain array of { caseId?, steps: [...] } out of whatever shape the
// uploaded JSON actually is. Recognizes a few real-world export shapes in
// addition to this app's own { "cases": [...] } format; throws a specific,
// actionable error for anything it can't turn into per-case event data.
function extractRawCases(raw) {
  if (Array.isArray(raw)) return raw;
  if (raw && Array.isArray(raw.cases)) return raw.cases;

  // Whatfix-style task-execution export: a shared "tasks" dictionary
  // (task_id -> name/duration) plus one entry per user session in
  // "task_executions", each holding that session's ordered task runs.
  if (raw && Array.isArray(raw.task_executions) && Array.isArray(raw.tasks)) {
    const taskNameById = new Map(raw.tasks.map((t) => [t.task_id, t.name || t.task_id]));
    return raw.task_executions.map((session, i) => {
      const steps = (session.tasks || []).map((exec) => ({
        task: taskNameById.get(exec.task_id) || exec.task_id || 'Unknown step',
        duration: exec.duration_ms != null ? exec.duration_ms / 60000 : exec.duration,
      }));
      const caseId = session.user_id
        ? `${String(session.user_id).slice(0, 8)}-${session.session_date || i + 1}`
        : `SESSION-${i + 1}`;
      return { caseId, steps, users: session.user_id ? [session.user_id] : [] };
    });
  }

  // Ground-truth process export: { processes: [{ nodes: [{id,name}],
  // execution_paths: [{ path: [{task_id, task_start_time, task_end_time}],
  // count, metadata }] }] }. Each execution_path is a distinct trace that
  // may represent more than one real case (via "count"), which is a
  // legitimate log-compression technique, not fabricated data — so it's
  // expanded into that many identical cases rather than counted once.
  if (raw && Array.isArray(raw.processes) && raw.processes.length) {
    const process = raw.processes[0];
    if (!Array.isArray(process.nodes) || !Array.isArray(process.execution_paths)) {
      throw new Error('Expected each entry in "processes" to have "nodes" and "execution_paths" arrays.');
    }
    const taskNameById = new Map(process.nodes.map((n) => [n.id, n.name || n.id]));
    const cases = [];
    process.execution_paths.forEach((ep, i) => {
      const steps = (ep.path || []).map((step) => {
        let duration = 0;
        if (step.task_start_time != null && step.task_end_time != null) {
          const ms = Number(step.task_end_time) - Number(step.task_start_time);
          if (Number.isFinite(ms) && ms > 0) duration = ms / 60000;
        }
        return { task: taskNameById.get(step.task_id) || step.task_id || 'Unknown step', duration };
      });
      const baseId = (ep.metadata && ep.metadata.support_ticket_id) || ep.id || `PATH-${i + 1}`;
      const repeat = Math.min(5000, Math.max(1, Math.round(Number(ep.count)) || 1));
      const epUsers = ep.users || [];
      for (let k = 0; k < repeat; k++) {
        cases.push({
          caseId: repeat > 1 ? `${baseId}-${k + 1}` : String(baseId),
          steps,
          users: epUsers.length ? [epUsers[k % epUsers.length]] : [],
        });
      }
    });
    return cases;
  }

  // A pre-built diagram (nodes/edges, e.g. from a layout tool) rather than
  // an event log. There's no per-case sequence or duration data to mine
  // here, so refuse rather than fabricate frequency/time/rework numbers.
  if (raw && Array.isArray(raw.nodes) && Array.isArray(raw.edges)) {
    throw new Error(
      'This file is a pre-built diagram (nodes/edges), not a case log. Frequency, time, and rework ' +
      'insights are computed from real process instances, so this tool needs per-case event data — ' +
      'e.g. { "cases": [{ "steps": [{ "task": "...", "duration": 12 }] }] } — not a static graph. ' +
      'Upload the underlying execution log if you have one.'
    );
  }

  throw new Error('Expected a JSON array of cases, or an object like { "cases": [...] }.');
}

// Validates and normalizes an arbitrary uploaded JSON payload into the same
// case-log shape generateEventLog() produces. Throws a descriptive Error
// (case/step index included) on anything it can't make sense of. Cases with
// no steps are dropped rather than failing the whole import, since a export
// covering thousands of cases will occasionally have an empty record.
function normalizeCaseLog(raw) {
  const rawCases = extractRawCases(raw);

  if (rawCases.length === 0) {
    throw new Error('The file has no cases to visualize.');
  }

  const cases = rawCases
    .map((rawCase, i) => {
      const caseNum = i + 1;
      let stepsRaw;
      let caseId;

      if (Array.isArray(rawCase)) {
        stepsRaw = rawCase;
        caseId = `CASE-${caseNum}`;
      } else if (rawCase && Array.isArray(rawCase.steps)) {
        stepsRaw = rawCase.steps;
        caseId = rawCase.caseId || rawCase.id || `CASE-${caseNum}`;
      } else {
        throw new Error(`Case ${caseNum} needs a "steps" array (or should itself be an array of steps).`);
      }

      if (stepsRaw.length === 0) return null;

      let cursor = 0;
      const steps = stepsRaw.map((rawStep, j) => {
        const stepNum = j + 1;
        let task;
        let duration = 0;

        if (typeof rawStep === 'string') {
          task = rawStep;
        } else if (rawStep && typeof rawStep === 'object') {
          task = rawStep.task || rawStep.name || rawStep.activity || rawStep.step;
          if (rawStep.duration != null) duration = Number(rawStep.duration);
          else if (rawStep.minutes != null) duration = Number(rawStep.minutes);
          else if (rawStep.durationMinutes != null) duration = Number(rawStep.durationMinutes);
          else if (rawStep.seconds != null) duration = Number(rawStep.seconds) / 60;
          else if (rawStep.durationHours != null) duration = Number(rawStep.durationHours) * 60;
        }

        if (!task || typeof task !== 'string') {
          throw new Error(
            `Case ${caseNum} ("${caseId}"), step ${stepNum} is missing a task name (expected "task", "name", "activity", or "step").`
          );
        }
        if (!Number.isFinite(duration) || duration < 0) duration = 0;

        const step = { task, startOffset: cursor, duration };
        cursor += duration;
        return step;
      });

      const users = rawCase && !Array.isArray(rawCase) && Array.isArray(rawCase.users) ? rawCase.users : [];
      return { caseId: String(caseId), totalDuration: cursor, steps, users };
    })
    .filter(Boolean);

  if (cases.length === 0) {
    throw new Error('None of the cases in this file have any steps.');
  }

  return cases;
}

// Turns a raw event log (array of cases) into a directly-follows graph plus
// the metrics that actually drive an automation decision: not just "what
// paths exist", but where time concentrates, where rework loops happen, and
// which observed path is fastest end-to-end.

function buildProcessModel(cases) {
  const nodeStats = new Map(); // task -> {visits, totalDuration, cases}
  const edgeStats = new Map(); // "from||to" -> {count, cases}
  const variantMap = new Map(); // signature -> {count, path, caseIds, totalDuration}
  const reworkStats = new Map(); // task -> {caseCount, extraVisits}
  const reworkedCaseIds = new Set(); // cases where ANY step repeated

  const touch = (map, key, init) => {
    if (!map.has(key)) map.set(key, init());
    return map.get(key);
  };

  for (const c of cases) {
    // Node stats: count every visit (a rework loop can visit a task twice)
    c.steps.forEach((s) => {
      const stat = touch(nodeStats, s.task, () => ({ visits: 0, totalDuration: 0, cases: new Set(), durations: [] }));
      stat.visits += 1;
      stat.totalDuration += s.duration;
      stat.cases.add(c.caseId);
      stat.durations.push(s.duration);
    });

    // Rework: did this case revisit the same task more than once?
    const visitsInCase = new Map();
    c.steps.forEach((s) => visitsInCase.set(s.task, (visitsInCase.get(s.task) || 0) + 1));
    visitsInCase.forEach((count, task) => {
      if (count > 1) {
        const r = touch(reworkStats, task, () => ({ caseCount: 0, extraVisits: 0 }));
        r.caseCount += 1;
        r.extraVisits += count - 1;
        reworkedCaseIds.add(c.caseId);
      }
    });

    // Edge stats. A transition is flagged as "rework" specifically when its
    // target task was already visited earlier in this same case — i.e. the
    // case is looping back to redo work, not just following a variant order
    // where that task happens to come later on its first-ever visit.
    const seenInCase = new Set();
    let prevTask = START;
    for (let i = 0; i <= c.steps.length; i++) {
      const toTask = i < c.steps.length ? c.steps[i].task : END;
      const key = `${prevTask}||${toTask}`;
      const stat = touch(edgeStats, key, () => ({ from: prevTask, to: toTask, count: 0, cases: new Set(), reworkCases: new Set() }));
      stat.count += 1;
      stat.cases.add(c.caseId);
      if (toTask !== END && seenInCase.has(toTask)) stat.reworkCases.add(c.caseId);
      if (toTask !== END) seenInCase.add(toTask);
      prevTask = toTask;
    }

    // Variant signature = the exact sequence of tasks (order matters, loops included)
    const signature = c.steps.map((s) => s.task).join(' → ');
    const variant = touch(variantMap, signature, () => ({
      signature,
      path: c.steps.map((s) => s.task),
      count: 0,
      caseIds: [],
      totalDuration: 0,
    }));
    variant.count += 1;
    variant.caseIds.push(c.caseId);
    variant.totalDuration += c.totalDuration;
  }

  const totalCases = cases.length;

  const nodes = Array.from(nodeStats.entries()).map(([task, stat]) => {
    const rework = reworkStats.get(task);
    return {
      id: task,
      label: task,
      visits: stat.visits,
      caseCount: stat.cases.size,
      casePct: stat.cases.size / totalCases,
      avgDuration: stat.totalDuration / stat.visits,
      medianDuration: median(stat.durations),
      totalTime: stat.totalDuration,
      reworkCaseCount: rework ? rework.caseCount : 0,
      reworkExtraVisits: rework ? rework.extraVisits : 0,
      reworkRate: (rework ? rework.caseCount : 0) / totalCases,
    };
  });
  nodes.push({ id: START, label: 'Start', visits: totalCases, caseCount: totalCases, casePct: 1, avgDuration: 0, medianDuration: 0, totalTime: 0, reworkCaseCount: 0, reworkRate: 0, virtual: true });
  nodes.push({ id: END, label: 'End', visits: totalCases, caseCount: totalCases, casePct: 1, avgDuration: 0, medianDuration: 0, totalTime: 0, reworkCaseCount: 0, reworkRate: 0, virtual: true });

  const edges = Array.from(edgeStats.values()).map((e) => ({
    from: e.from,
    to: e.to,
    count: e.count,
    caseCount: e.cases.size,
    casePct: e.cases.size / totalCases,
    reworkCaseCount: e.reworkCases.size,
  }));

  const variants = Array.from(variantMap.values())
    .sort((a, b) => b.count - a.count)
    .map((v, i) => ({
      ...v,
      rank: i + 1,
      pct: v.count / totalCases,
      avgDuration: v.totalDuration / v.count,
    }));

  // The most frequent variant is treated as the "happy path" baseline.
  const happyPath = variants[0];
  const happyPathEdgeKeys = new Set();
  if (happyPath) {
    const seq = [START, ...happyPath.path, END];
    for (let i = 0; i < seq.length - 1; i++) happyPathEdgeKeys.add(`${seq[i]}||${seq[i + 1]}`);
  }
  edges.forEach((e) => {
    e.onHappyPath = happyPathEdgeKeys.has(`${e.from}||${e.to}`);
  });

  // Where is the most time being spent? Rank real tasks by their aggregate
  // time burden (avg duration × how often it's hit) — that's what actually
  // drives ROI, not just the slowest single visit.
  const realNodes = nodes.filter((n) => !n.virtual);
  const totalProcessTime = realNodes.reduce((s, n) => s + n.totalTime, 0);
  realNodes.forEach((n) => { n.timeShare = totalProcessTime ? n.totalTime / totalProcessTime : 0; });
  const timeRanking = realNodes.slice().sort((a, b) => b.totalTime - a.totalTime);

  // Where is the most rework happening?
  const reworkRanking = realNodes.filter((n) => n.reworkCaseCount > 0).sort((a, b) => b.reworkCaseCount - a.reworkCaseCount);

  // Which observed path finishes fastest? Ignore one-off outlier variants
  // (fewer than ~1% of cases) so a single lucky case can't claim the title.
  const significantVariants = variants.filter((v) => v.count >= Math.max(2, totalCases * 0.01));
  const fastestPath = (significantVariants.length ? significantVariants : variants)
    .slice()
    .sort((a, b) => a.avgDuration - b.avgDuration)[0];

  return {
    nodes,
    edges,
    variants,
    totalCases,
    happyPath,
    fastestPath,
    totalProcessTime,
    timeRanking,
    reworkRanking,
    reworkedCasePct: reworkedCaseIds.size / totalCases,
  };
}

  <script>
// Sample process catalog for the Overview page. Exactly 10 example rows.
// #1 "Purchase Order to Payment" opens the process map's own synthetic demo
// generator. #2 and #3 are backed by real uploaded ground-truth data (see
// sample-datasets.js) — their stats below are computed from that data, not
// invented. The rest are decorative placeholders to fill out the table.

const PURCHASE_ORDER_TEMPLATE = {
  title: 'Purchase Order to Payment',
  description: 'End-to-end purchase order handling: request, approval, vendor selection, receipt, and payment',
  role: 'Manager',
  businessUnit: 'Finance',
  medianDurationSeconds: 79200,
  processCount: 500,
  users: 340,
};

// A process whose very first step is a decision node: the amount on the
// request splits cases into three structurally distinct downstream
// processes (not just a deviation of the same path). Opens a dedicated
// decision-map view instead of the standard directly-follows graph.
const DECISION_MAP_TEMPLATE = {
  title: 'Purchase Approval by Cost',
  description: 'Authorisation routes into one of three distinct approval processes based on the request cost',
  role: 'Manager',
  businessUnit: 'Finance',
  medianDurationSeconds: 927,
  processCount: 60,
  users: 44,
  targetPage: 'decision-map.html',
};

const PLACEHOLDER_TEMPLATES = [
  { title: 'Care transition', description: 'Changing the hospitals for a patient based on request', role: 'Support', businessUnit: 'Support', medianDurationSeconds: 792, processCount: 165, users: 235 },
  { title: 'Pharmacy selection', description: 'Selecting the pharmacy based on medical records', role: 'Coordinator', businessUnit: 'Finance', medianDurationSeconds: 724, processCount: 176, users: 432 },
  { title: 'Claim denial handling', description: 'Reviewing denial reasons and identifying next steps', role: 'Support', businessUnit: 'Finance', medianDurationSeconds: 662, processCount: 198, users: 875 },
  { title: 'Claim approval', description: 'Analysing claim denial reasons and suggesting next steps', role: 'Manager', businessUnit: 'Finance', medianDurationSeconds: 604, processCount: 132, users: 654 },
  { title: 'Monitoring existing processes', description: 'Reviewing the progress of existing processes', role: 'Coordinator', businessUnit: 'Support', medianDurationSeconds: 661, processCount: 145, users: 767 },
  { title: 'Provider network review', description: 'Verifying provider eligibility against the current network', role: 'Analyst', businessUnit: 'Operations', medianDurationSeconds: 670, processCount: 106, users: 372 },
];

function formatMedianDuration(rawSeconds) {
  const totalSeconds = Math.round(rawSeconds);
  if (totalSeconds >= 3600) {
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    return `${h}h ${String(m).padStart(2, '0')}m`;
  }
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}

// median() is defined in data.js, loaded before this file on home.html.

// Turns one embedded real dataset into a catalog row by actually running it
// through the same normalizeCaseLog/buildProcessModel pipeline the Import
// modal uses, so the stats shown here are real, not placeholders.
function buildRealExampleRow(example, index) {
  try {
    const cases = normalizeCaseLog(example.data);
    const totalDurations = cases.map((c) => c.totalDuration);
    const process = example.data.processes[0];
    const distinctUsers = new Set(
      (process.execution_paths || []).flatMap((ep) => ep.users || [])
    );
    return {
      id: `PROC-REAL-${index}`,
      title: example.title,
      description: example.description,
      role: example.role,
      businessUnit: example.businessUnit,
      medianDurationSeconds: median(totalDurations) * 60,
      processCount: cases.length,
      users: distinctUsers.size || cases.length,
      datasetRaw: example.data,
    };
  } catch (err) {
    return {
      id: `PROC-REAL-${index}`,
      title: example.title,
      description: example.description,
      role: example.role,
      businessUnit: example.businessUnit,
      medianDurationSeconds: 0,
      processCount: 0,
      users: 0,
      datasetRaw: example.data,
    };
  }
}

function generateProcessCatalog() {
  const rows = [
    { id: 'PROC-1000', ...PURCHASE_ORDER_TEMPLATE },
    { id: 'PROC-1001', ...DECISION_MAP_TEMPLATE },
  ];
  (typeof EXTRA_PROCESS_EXAMPLES !== 'undefined' ? EXTRA_PROCESS_EXAMPLES : []).forEach((example, i) => {
    rows.push(buildRealExampleRow(example, i + 1));
  });
  PLACEHOLDER_TEMPLATES.forEach((template, i) => {
    rows.push({ id: `PROC-${1010 + i}`, ...template });
  });
  return rows;
}

</script>
  <script>
const PAGE_SIZE = 16;

const state = {
  all: generateProcessCatalog(),
  search: '',
  businessUnit: '',
  sortDir: null, // null = as-discovered order; 'asc' | 'desc' once the Title header is clicked
  page: 1,
};

function getFiltered() {
  let rows = state.all;
  if (state.businessUnit) rows = rows.filter((r) => r.businessUnit === state.businessUnit);
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter((r) => r.title.toLowerCase().includes(q) || r.description.toLowerCase().includes(q));
  }
  if (state.sortDir) {
    rows = rows.slice().sort((a, b) => (state.sortDir === 'asc' ? a.title.localeCompare(b.title) : b.title.localeCompare(a.title)));
  }
  return rows;
}

function renderStats() {
  document.getElementById('stat-total-processes').textContent = state.all.length;
  document.getElementById('stat-total-users').textContent = state.all.reduce((s, r) => s + r.users, 0).toLocaleString();
  document.getElementById('stat-total-roles').textContent = new Set(state.all.map((r) => r.role)).size;
  document.getElementById('stat-total-bu').textContent = new Set(state.all.map((r) => r.businessUnit)).size;
}

function renderFilterOptions() {
  const select = document.getElementById('filter-bu');
  const units = Array.from(new Set(state.all.map((r) => r.businessUnit))).sort();
  units.forEach((u) => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    select.appendChild(opt);
  });
}

function openProcess(row) {
  if (row.targetPage) {
    window.location.href = row.targetPage;
    return;
  }
  sessionStorage.setItem('selectedProcessName', row.title);
  if (row.datasetRaw) {
    sessionStorage.setItem('selectedProcessData', JSON.stringify(row.datasetRaw));
  } else {
    sessionStorage.removeItem('selectedProcessData');
  }
  window.location.href = 'index.html';
}

function renderTable() {
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  state.page = Math.min(state.page, totalPages);
  const start = (state.page - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('process-tbody');
  tbody.innerHTML = '';
  document.getElementById('empty-state').classList.toggle('hidden', pageRows.length > 0);

  pageRows.forEach((row) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="process-title">${escapeHtml(row.title)}</div>
        <div class="process-description">${escapeHtml(row.description)}</div>
      </td>
      <td>${escapeHtml(row.role)}</td>
      <td>${escapeHtml(row.businessUnit)}</td>
      <td class="num">${formatMedianDuration(row.medianDurationSeconds)}</td>
      <td class="num">${row.processCount}</td>
      <td class="num">${row.users.toLocaleString()}</td>
    `;
    tr.addEventListener('click', () => openProcess(row));
    tbody.appendChild(tr);
  });

  const rangeStart = filtered.length === 0 ? 0 : start + 1;
  const rangeEnd = Math.min(start + PAGE_SIZE, filtered.length);
  document.getElementById('rows-summary').textContent = `Rows ${rangeStart}-${rangeEnd} of ${filtered.length}`;

  renderPagination(totalPages);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  el.innerHTML = '';

  const addPageBtn = (label, page, opts = {}) => {
    const btn = document.createElement('button');
    btn.className = `page-btn${opts.active ? ' active' : ''}`;
    btn.textContent = label;
    btn.disabled = !!opts.disabled;
    btn.addEventListener('click', () => { state.page = page; renderTable(); });
    el.appendChild(btn);
  };

  addPageBtn('‹', state.page - 1, { disabled: state.page <= 1 });

  const pageNumbers = new Set([1, totalPages, state.page, state.page - 1, state.page + 1].filter((p) => p >= 1 && p <= totalPages));
  const sorted = Array.from(pageNumbers).sort((a, b) => a - b);
  let prev = 0;
  sorted.forEach((p) => {
    if (p - prev > 1) {
      const span = document.createElement('span');
      span.className = 'page-ellipsis';
      span.textContent = '…';
      el.appendChild(span);
    }
    addPageBtn(String(p), p, { active: p === state.page });
    prev = p;
  });

  addPageBtn('›', state.page + 1, { disabled: state.page >= totalPages });
}

document.getElementById('search-input').addEventListener('input', (e) => {
  state.search = e.target.value;
  state.page = 1;
  renderTable();
});

document.getElementById('filter-button').addEventListener('click', () => {
  document.getElementById('filter-panel').classList.toggle('hidden');
});
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.filter-wrap');
  if (!wrap.contains(e.target)) document.getElementById('filter-panel').classList.add('hidden');
});
document.getElementById('filter-bu').addEventListener('change', (e) => {
  state.businessUnit = e.target.value;
  state.page = 1;
  renderTable();
});

document.getElementById('sort-title').addEventListener('click', () => {
  state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  state.page = 1;
  renderTable();
});

document.getElementById('sidebar-collapse').addEventListener('click', () => {
  document.getElementById('side-nav').classList.toggle('collapsed');
});

renderStats();
renderFilterOptions();
renderTable();

</script>
